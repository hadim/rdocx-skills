# Publishes a release of the plugin, by hand (Actions, release, Run workflow). Pushes to main reach nobody: `release`
# is the repository's default branch, so Claude Code and Claude Desktop users (`/plugin marketplace add
# hadim/rdocx-skills`) and the Claude plugin directory follow it, and get a new version only from here.
#
# The plugin's releases are the only published builds, and each one carries its own files: those of the ci.yml run
# that passed on the tree it releases (built and attested there, the attestation checked here), else the pinned
# commit built here on the four platforms (no macos-x86_64) and attested here. It runs the acceptance suite on those
# very files and attaches the CLIs and wheels to the release with their SHA256SUMS (attested here). Nothing is
# published unless the four platforms pass. Older releases stay, each with its own files, so an older plugin version
# still installs; clean-ups are done by hand.
#
# The release takes main as it is, once ci.yml passed on its tree (on main, or on the pull request merged into it,
# .github/scripts/tested-tree.sh): the CalVer version vYYYY.M.D (vYYYY.M.D.2 and on for another release the same
# day), the `release` branch moved to main's tree with that version written into plugin/.claude-plugin/plugin.json
# and the lock pointed at this release's files and their hashes (a merge of main, so that `release` only moves
# forward), a tag on it, and a GitHub release titled with the rdocx and rpptx versions of the build, marked latest,
# whose notes describe its files, give the suite on the four platforms and list the merged pull requests since the
# previous release. The version, the title and the head of the notes come from .github/scripts/plugin_release.py
# (tested in tests/test_ci_scripts.py).
#
# Then the conda package `rdocx-skills` of the release (job `conda`): its files for each platform, as published,
# repackaged by conda/recipe.yaml, tested, and uploaded to https://prefix.dev/hadim/rdocx-skills by the channel's
# trusted publisher (this workflow, through OIDC); the channel keeps the 10 latest versions (job `conda-prune`).
# `conda_only: vVERSION` does only that, for a release made before.
#
# `dry_run`: everything but the release itself, on the branch the workflow runs from (to try a change of this
# workflow on a pull request branch): build, suite, release files and lock kept as the workflow artifact
# `release-files`; no attestation, no branch, no tag, no release; the conda packages of the latest release (or of
# `conda_only`) built, tested and kept as the artifacts `conda-<platform>`, nothing uploaded or deleted.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test the branch this runs from, and publish nothing"
        type: boolean
        default: false
      conda_only:
        description: "Only the conda packages of this existing release (vYYYY.M.D), not a new release"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: inputs.conda_only == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # the artifacts of ci.yml's runs: the mark of main's tree
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      run: ${{ steps.tree.outputs.run }}
      tree: ${{ steps.tree.outputs.tree }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dry_run && github.sha || 'main' }}
          fetch-depth: 0

      # the ci.yml run that passed on this tree: its files are the release's (build job)
      - name: Tree
        id: tree
        run: .github/scripts/tested-tree.sh 2>> "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Check main
        if: ${{ !inputs.dry_run }}
        env:
          PASSED: ${{ steps.tree.outputs.passed }}
        run: |
          main=$(git rev-parse HEAD)
          if [ "$PASSED" != true ]; then
            echo "ci.yml has not passed on the tree of main ${main:0:12}; release only a main that passed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if git fetch -q origin release 2>/dev/null && git merge-base --is-ancestor "$main" FETCH_HEAD; then
            echo "main ${main:0:12} is released already: nothing new to release" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Version
        id: plan
        run: |
          mapfile -t tags < <(git tag -l 'v*')
          version=$(python3 .github/scripts/plugin_release.py version --date "$(date -u +%F)" "${tags[@]}")
          previous=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          commit=$(python3 -c 'import json; print(json.load(open("plugin/rdocx.lock.json"))["commit"])')
          { echo "sha=$(git rev-parse HEAD)"; echo "commit=$commit"; echo "version=$version"
            echo "previous=$previous"; } >> "$GITHUB_OUTPUT"
          echo "release v$version of skills $(git rev-parse --short=12 HEAD), rdocx ${commit:0:12}, dry run: ${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"

  # The files of the ci.yml run that passed on this tree, when it kept them (its attestation checked), else the pinned
  # commit built from source here (the same steps as ci.yml, attested here); installed, recorded into this run's copy
  # of the lock, and the acceptance suite run on them.
  build:
    needs: plan
    permissions:
      contents: read
      actions: read        # the files of the ci.yml run
      id-token: write      # the attestation of files built here
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-22.04 }
          - { platform: linux-aarch64, runner: ubuntu-22.04-arm }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: windows-x86_64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      # LF on Windows too, without a .gitattributes (the plugin directory refuses one that rewrites files at checkout):
      # the bash recipes, the .sh scripts and the regexes over the Markdown read LF.
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: This runner builds this platform
        run: test "$(python -c 'import sys; sys.path.insert(0, "plugin/scripts"); import rdocx_env; print(rdocx_env.platform_key())')" = "$PLATFORM"

      # A file is reused only when an attestation of ci.yml, on a GitHub-hosted runner, names a commit with exactly
      # the tree released here, that is this very ci.yml and build steps on these sources; else it is built here.
      - name: Files of the ci.yml run that passed on this tree
        id: reuse
        if: needs.plan.outputs.run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.plan.outputs.run }}
          TREE: ${{ needs.plan.outputs.tree }}
        run: |
          dir="plugin/dist/$COMMIT/$PLATFORM"
          reused=false
          if gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "dist-$PLATFORM" -D "$dir"; then
            reused=true
            for f in "$dir"/*; do
              commits=$(gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --deny-self-hosted-runners \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --format json \
                --jq '.[].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit' \
                || true)
              ok=false
              for c in $commits; do
                if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$c" --jq .tree.sha || true)" = "$TREE" ]; then
                  ok=true
                  break
                fi
              done
              if [ "$ok" != true ]; then
                echo "$PLATFORM: $(basename "$f") has no ci.yml attestation built from this tree: building here" >> "$GITHUB_STEP_SUMMARY"
                reused=false
                break
              fi
            done
          fi
          if [ "$reused" = true ]; then
            python plugin/scripts/rdocx_env.py lock --write  # then `install` takes this folder, checked against it
            echo "$PLATFORM: the files of ci.yml run $RUN, attested there from this tree" >> "$GITHUB_STEP_SUMMARY"
          else
            rm -rf "$dir"
          fi
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain named by rdocx's rust-toolchain.toml
        if: steps.reuse.outputs.reused != 'true'
        run: .github/scripts/rust-toolchain.sh "$COMMIT"

      - name: ThinLTO and 16 codegen units
        if: steps.reuse.outputs.reused != 'true'
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=thin" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"

      # ci.yml's cache: a commit it built compiles nothing again
      - name: Restore the cargo registry and the build folder
        id: cache
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-zigbuild
            ~/.local/share/rdocx-skills/target
          key: rdocx-build-thin-${{ matrix.platform }}-${{ matrix.runner }}-${{ needs.plan.outputs.commit }}
          restore-keys: rdocx-build-thin-${{ matrix.platform }}-${{ matrix.runner }}-

      # the Linux files link glibc 2.28 through zig, whatever the runner's glibc (rdocx_env.py build); kept in the cache
      - name: cargo-zigbuild
        if: runner.os == 'Linux' && steps.reuse.outputs.reused != 'true'
        run: |
          if ! cargo-zigbuild --version 2> /dev/null | grep -q '^cargo-zigbuild 0\.20\.1$'; then
            cargo install --locked --force cargo-zigbuild --version 0.20.1
          fi

      # main's lock names no build: `install --build` installs the files above, or compiles the commit
      - name: Build and install
        run: python plugin/scripts/rdocx_env.py install --build

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !inputs.dry_run && steps.reuse.outputs.reused != 'true' }}
        with:
          subject-path: plugin/dist/${{ needs.plan.outputs.commit }}/${{ matrix.platform }}/*

      # also after a failed build: the next attempt starts from what compiled
      - name: Save the cargo registry and the build folder
        if: ${{ !cancelled() && steps.reuse.outputs.reused != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-zigbuild
            ~/.local/share/rdocx-skills/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # a binary needs the glibc it was linked against: zig links 2.28 (rdocx_env.py build), a plain cargo build the
      # runner's own, which would raise the floor
      - name: The Linux CLIs and modules need glibc 2.28 at most
        if: runner.os == 'Linux'
        run: |
          home=~/.local/share/rdocx-skills/current
          for f in "$home"/bin/rdocx "$home"/bin/rpptx "$home"/venv/lib/python3*/site-packages/{rdocx/_rdocx,rpptx/_rpptx}.abi3.so; do
            need=$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
            echo "$(basename "$f") needs $need"
            test "$(printf '%s\nGLIBC_2.28\n' "$need" | sort -V | tail -n 1)" = GLIBC_2.28
          done

      - name: The installed CLIs and modules run
        run: |
          bin=~/.local/share/rdocx-skills/current/bin
          "$bin/rdocx" --version
          "$bin/rpptx" --version
          "$bin/python" -c "import rdocx, rpptx"

      - name: Record this build in the run's copy of the lock
        run: python plugin/scripts/rdocx_env.py lock --write

      - name: Poppler, for the PDF text and raster checks
        run: .github/scripts/poppler.sh

      - name: Acceptance suite on the files it publishes
        # one worker per core, each file on one worker in order (the recipes of a file build on each other)
        run: python plugin/scripts/rdocx_env.py test --allow-local -n auto --dist loadfile 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Suite summary
        if: always()
        run: |
          .github/scripts/suite-summary.sh "$RUNNER_TEMP/pytest.log" "$PLATFORM" > "$RUNNER_TEMP/suite-$PLATFORM.md"
          cat "$RUNNER_TEMP/suite-$PLATFORM.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: suite-${{ matrix.platform }}
          path: ${{ runner.temp }}/suite-${{ matrix.platform }}.md
          overwrite: true  # a re-run job uploads it again in the same run

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: plugin/dist/${{ needs.plan.outputs.commit }}/${{ matrix.platform }}/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash  # -eo pipefail
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/artifacts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: suite-*
          path: ${{ runner.temp }}/suites

      # The asset names that rdocx_env.py downloads, `<platform>.<file>`, listed in SHA256SUMS.
      - name: Release files
        run: |
          mkdir assets
          for dir in "$RUNNER_TEMP"/artifacts/dist-*; do
            plat=${dir##*/dist-}
            n=0
            for f in "$dir"/rdocx "$dir"/rpptx "$dir"/rdocx.exe "$dir"/rpptx.exe "$dir"/*.whl; do
              [ -e "$f" ] || continue  # the CLIs are rdocx.exe and rpptx.exe on Windows only
              cp "$f" "assets/$plat.$(basename "$f")"
              n=$((n + 1))
            done
            [ "$n" -eq 4 ] || { echo "$plat: expected 2 CLIs and 2 wheels, found $n files"; exit 1; }
          done
          (cd assets && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS assets/
          cat assets/SHA256SUMS

      # The lock of the release branch: this release's URL and the hashes of its files, recorded by rdocx_env.py from
      # a local mirror of the release (file:// URLs), the same way as from a published one.
      - name: Lock of the release
        id: lock
        run: |
          mkdir -p "$RUNNER_TEMP/mirror"
          cp -R assets "$RUNNER_TEMP/mirror/v$VERSION"
          python3 - <<'EOF'
          import json, os
          path = "plugin/rdocx.lock.json"
          lock = json.load(open(path))
          lock.update(release=f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{os.environ['VERSION']}",
                      versions={}, artifacts={}, installed_files={})
          open(path, "w").write(json.dumps(lock, indent=2) + "\n")
          EOF
          RDOCX_HOME="$RUNNER_TEMP/home" RDOCX_RELEASE_URL="file://$RUNNER_TEMP/mirror" \
            python3 plugin/scripts/rdocx_env.py lock --write --release
          mv plugin/rdocx.lock.json "$RUNNER_TEMP/release-lock.json"
          git checkout -- plugin/rdocx.lock.json
          echo "title=$(python3 .github/scripts/plugin_release.py title "$RUNNER_TEMP/release-lock.json")" >> "$GITHUB_OUTPUT"

      - name: Notes
        run: |
          python3 .github/scripts/plugin_release.py notes --repo "$GITHUB_REPOSITORY" --version "$VERSION" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$RUNNER_TEMP/release-lock.json" > "$RUNNER_TEMP/notes.md"
          { echo; echo "## Acceptance suite"; for f in "$RUNNER_TEMP"/suites/suite-*/suite-*.md; do echo; cat "$f"; done
            echo; } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: What a release would publish (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          mkdir "$RUNNER_TEMP/release-files"
          cp -R assets "$RUNNER_TEMP/release-files/"
          cp "$RUNNER_TEMP/release-lock.json" "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release-files/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.dry_run }}
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/

      # the CLIs and wheels are attested by the run that built them (ci.yml, or the build job above)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-path: assets/SHA256SUMS

      - name: Move the release branch and tag it
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin release > /dev/null; then
            git fetch -q origin release
            git checkout -q -B release FETCH_HEAD
            git merge -q --no-ff --no-commit -s ours "$SHA"  # main as the second parent; its tree comes next
          else
            git checkout -q -B release "$SHA"
          fi
          git read-tree -u --reset "$SHA"
          python3 .github/scripts/plugin_release.py set-version plugin/.claude-plugin/plugin.json "$VERSION"
          cp "$RUNNER_TEMP/release-lock.json" plugin/rdocx.lock.json
          git add plugin/.claude-plugin/plugin.json plugin/rdocx.lock.json
          git commit -q -m "release: v$VERSION"
          git tag -a "v$VERSION" -m "Plugin release $VERSION"
          git push --atomic origin release "refs/tags/v$VERSION"
          echo "release branch at $(git rev-parse --short=12 HEAD): main ${SHA:0:12} with version $VERSION and its own files" >> "$GITHUB_STEP_SUMMARY"

      # gh creates the release as a draft, uploads the files, then publishes it.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          TITLE: ${{ steps.lock.outputs.title }}
        run: |
          changes=()  # the merged pull requests since the previous release, after the notes' head
          if [ -n "$PREVIOUS" ]; then changes=(--generate-notes --notes-start-tag "$PREVIOUS"); fi
          gh release create "v$VERSION" assets/* -R "$GITHUB_REPOSITORY" --verify-tag --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md" "${changes[@]}" --latest
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"

  # The release's own files, as published and checked against its lock, repackaged on each platform's own runner
  # (the package's Python modules and CLIs are run there before the upload), then uploaded as they were tested.
  conda:
    needs: [plan, publish]
    if: ${{ !cancelled() && (inputs.conda_only != '' || needs.publish.result == 'success') }}
    permissions:
      contents: read
      id-token: write  # the channel's trusted publisher
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, subdir: linux-64, runner: ubuntu-22.04 }
          - { platform: linux-aarch64, subdir: linux-aarch64, runner: ubuntu-22.04-arm }
          - { platform: macos-arm64, subdir: osx-arm64, runner: macos-15 }
          - { platform: windows-x86_64, subdir: win-64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: ${{ matrix.platform }}
      SUBDIR: ${{ matrix.subdir }}
    steps:
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          run-install: false
          cache: false

      - name: Release
        env:
          CONDA_ONLY: ${{ inputs.conda_only }}
          VERSION: ${{ needs.plan.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$CONDA_ONLY" ]; then tag=$CONDA_ONLY
          elif [ "$DRY_RUN" = true ]; then tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          else tag=v$VERSION; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "$PLATFORM: conda package of $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the release's files
        run: python .github/scripts/conda_package.py stage --release "$TAG" --platform "$PLATFORM" --out conda/dist >> "$GITHUB_ENV"

      # into a local channel: built, indexed, then tested from there before anything is uploaded
      - name: Package
        run: |
          channel="$(cd "$RUNNER_TEMP" && { pwd -W 2>/dev/null || pwd; })/conda-channel"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          pixi publish --path conda/recipe.yaml --target-channel "$channel"
          ls -l "$channel/$SUBDIR"/*.conda

      # solved as on a machine with the Linux files' glibc floor, the default of pixi workspaces
      - name: The package's modules and CLIs run, on the oldest and the newest Python
        env:
          CONDA_OVERRIDE_GLIBC: "2.28"
        run: |
          for py in 3.10 3.13; do
            pixi exec -c "$CHANNEL" -c conda-forge -s "rdocx-skills==${TAG#v}" -s "python=$py" \
              python -c "import rdocx, rpptx, sys; print(sys.version.split()[0], rdocx.Document, rpptx.Presentation)"
          done
          pixi exec -c "$CHANNEL" -c conda-forge -s "rdocx-skills==${TAG#v}" rdocx --version
          pixi exec -c "$CHANNEL" -c conda-forge -s "rdocx-skills==${TAG#v}" rpptx --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conda-${{ matrix.platform }}
          path: ${{ env.CHANNEL }}/${{ matrix.subdir }}/*.conda
          if-no-files-found: error
          overwrite: true

      # a package already there (a re-run) is skipped
      - name: Upload to prefix.dev
        if: ${{ !inputs.dry_run }}
        run: |
          pixi upload prefix --channel hadim/rdocx-skills --skip-existing "$CHANNEL/$SUBDIR"/*.conda
          echo "$PLATFORM: uploaded to https://prefix.dev/channels/hadim/rdocx-skills" >> "$GITHUB_STEP_SUMMARY"

  # The free plan holds 3 GB, about 15 releases: the channel keeps the 10 latest versions (the GitHub releases keep
  # all their files).
  conda-prune:
    needs: conda
    if: ${{ !cancelled() && needs.conda.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # the channel's trusted publisher, which may delete
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep the 10 latest versions
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 .github/scripts/conda_package.py prune --channel https://prefix.dev/hadim/rdocx-skills --keep 10 \
            $([ "$DRY_RUN" = true ] && echo --dry-run) | tee -a "$GITHUB_STEP_SUMMARY"
