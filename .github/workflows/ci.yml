# The acceptance suite on linux-x86_64, macos-arm64 and windows-x86_64: the pinned files from this repository's
# release, checked against the lock (seconds), or a build of the pinned commit when no release has them yet (right
# after a bump, or a platform the release lacks; minutes).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: macos-arm64, runner: macos-14 }
          - { platform: windows-x86_64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned build from the release
        id: release
        continue-on-error: true
        run: python scripts/rdocx_env.py install

      - name: Pinned commit
        if: steps.release.outcome == 'failure'
        id: pin
        run: echo "commit=$(python -c 'import json; print(json.load(open("rdocx.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain named by rdocx's rust-toolchain.toml
        if: steps.release.outcome == 'failure'
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: .github/scripts/rust-toolchain.sh "$COMMIT"

      - name: Restore the cargo registry and the build folder
        if: steps.release.outcome == 'failure'
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.local/share/rdocx-skills/target
          key: rdocx-build-ci-${{ matrix.platform }}-${{ steps.pin.outputs.commit }}
          restore-keys: rdocx-build-ci-${{ matrix.platform }}-

      - name: Build and install the pinned commit
        if: steps.release.outcome == 'failure'
        run: python scripts/rdocx_env.py install --build

      - name: Save the cargo registry and the build folder
        if: steps.release.outcome == 'failure' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.local/share/rdocx-skills/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Poppler, for the PDF text and raster checks
        run: .github/scripts/poppler.sh

      - name: Acceptance suite
        run: python scripts/rdocx_env.py test --allow-local
