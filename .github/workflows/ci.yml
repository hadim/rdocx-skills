# The acceptance suite on linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64 and windows-x86_64: the pinned
# files from the releases the lock names (upstream's, or this repository's build of a commit between two upstream
# releases), checked against the lock (seconds), or a build of the pinned commit when no release has them yet (right
# after a bump, or a platform the release lacks; minutes). The whole suite runs on the five platforms for a push to
# main, a run by hand, and a pull request that changes the lock (a new build to accept); any other pull request runs
# it on linux-x86_64 and the platform smoke subset (`-m smoke`, SMOKE in tests/conftest.py) on the four others. On a
# push to main, when the lock pins one of this repository's releases, the suite summaries of the five platforms
# become the "Acceptance suite" section of that release's notes (re-running replaces it).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What each platform runs: `full` (the whole suite) or `smoke` (the platform subset).
  scope:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2  # a pull request checks out its merge commit: HEAD^1 is the base branch

      - name: Full suite everywhere, or on linux-x86_64 only
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PLATFORMS: >-
            [{"platform": "linux-x86_64", "runner": "ubuntu-24.04"},
            {"platform": "linux-aarch64", "runner": "ubuntu-22.04-arm"},
            {"platform": "macos-arm64", "runner": "macos-14"},
            {"platform": "macos-x86_64", "runner": "macos-15-intel"},
            {"platform": "windows-x86_64", "runner": "windows-2025"}]
        run: |
          full=true
          if [ "$EVENT" = pull_request ] && git diff --quiet HEAD^1 HEAD -- rdocx.lock.json; then full=false; fi
          matrix=$(FULL=$full python3 -c 'import json, os; full = os.environ["FULL"] == "true"; print(json.dumps([dict(p, suite="full" if full or p["platform"] == "linux-x86_64" else "smoke") for p in json.loads(os.environ["PLATFORMS"])]))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$full" = true ]; then
            echo "The whole suite on the five platforms ($EVENT)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The lock is unchanged: the whole suite on linux-x86_64, the smoke subset on the four others." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned build from the release
        id: release
        continue-on-error: true
        run: python scripts/rdocx_env.py install

      - name: Pinned commit
        if: steps.release.outcome == 'failure'
        id: pin
        run: echo "commit=$(python -c 'import json; print(json.load(open("rdocx.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain named by rdocx's rust-toolchain.toml
        if: steps.release.outcome == 'failure'
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: .github/scripts/rust-toolchain.sh "$COMMIT"

      - name: Restore the cargo registry and the build folder
        if: steps.release.outcome == 'failure'
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.local/share/rdocx-skills/target
          key: rdocx-build-ci-${{ matrix.platform }}-${{ steps.pin.outputs.commit }}
          restore-keys: rdocx-build-ci-${{ matrix.platform }}-

      - name: Build and install the pinned commit
        if: steps.release.outcome == 'failure'
        run: python scripts/rdocx_env.py install --build

      # also after a failed build: the next attempt starts from what compiled
      - name: Save the cargo registry and the build folder
        if: ${{ !cancelled() && steps.release.outcome == 'failure' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.local/share/rdocx-skills/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Poppler, for the PDF text and raster checks
        run: .github/scripts/poppler.sh

      - name: Acceptance suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = smoke ]; then set -- -m smoke; fi
          python scripts/rdocx_env.py test --allow-local "$@" 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Suite summary
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          SUITE: ${{ matrix.suite }}
          BUILT: ${{ steps.release.outcome == 'failure' }}
        run: |
          heading=$PLATFORM
          if [ "$SUITE" = smoke ]; then heading="$PLATFORM (smoke subset)"; fi
          if [ "$BUILT" = true ]; then heading="$heading (built from the pinned commit: the release lacks its files)"; fi
          .github/scripts/suite-summary.sh "$RUNNER_TEMP/pytest.log" "$heading" > "$RUNNER_TEMP/suite-$PLATFORM.md"
          cat "$RUNNER_TEMP/suite-$PLATFORM.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: suite-${{ matrix.platform }}
          path: ${{ runner.temp }}/suite-${{ matrix.platform }}.md
          overwrite: true  # a re-run job uploads it again in the same run

  # The suite in the notes of the release the lock pins, when it is one of this repository's builds
  # (rdocx-<YYYYMMDDHHMM>-<commit12>, or rdocx-<YYYYMMDD>-<commit12> for the older ones); upstream releases are
  # never touched. A push to main runs the whole suite on the five platforms. Also after a failing leg: its failures
  # are what the notes must show.
  release-notes:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: suite-*
          path: ${{ runner.temp }}/suites

      - name: Final suite in the release notes
        run: |
          tag=$(python3 .github/scripts/release_notes.py tag --repo "$GITHUB_REPOSITORY" rdocx.lock.json)
          if [ -z "$tag" ]; then
            echo "The lock does not pin a release of this repository: no release notes to update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          python3 .github/scripts/release_notes.py rewrite --notes "$RUNNER_TEMP/notes.md" --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$RUNNER_TEMP"/suites/suite-*/suite-*.md > "$RUNNER_TEMP/final-notes.md"
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/final-notes.md"
          echo "Final suite written into the notes of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
