# The acceptance suite on linux-x86_64, linux-aarch64, macos-arm64 and windows-x86_64 (Intel Macs are not tested),
# on a build of the pinned commit made here: main's lock names the upstream commit only, and the plugin's releases
# (release.yml) are the only published builds. The build's hashes are recorded into this run's copy of the lock
# (`lock --write`, never committed), so that the install and download tests check it as they would a release. The
# build folder is cached per platform and commit: a commit already built here compiles nothing again (the source
# export carries the commit's time, so cargo finds the restored build fresh). A run whose four suites pass marks the
# tree it tested (the artifact `tested-tree-<tree>`, .github/scripts/tested-tree.sh): a push to main with a tree
# that already passed, a pull request merged while main stood still, runs the suite no more, and release.yml takes
# that mark instead of a run on main's commit, and the files that run built and attested instead of building again.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tree:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # the artifacts of earlier runs
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      passed: ${{ steps.tree.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tree, and whether it passed already
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            .github/scripts/tested-tree.sh 2>> "$GITHUB_STEP_SUMMARY"
          else
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "passed=false"
          fi >> "$GITHUB_OUTPUT"

  test:
    needs: tree
    if: needs.tree.outputs.passed != 'true'
    permissions:
      contents: read
      id-token: write      # the provenance attestation of the built files
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # release.yml's runners: the build folder they cache is reused as it is, links included, so the release
          # files keep the glibc 2.35 floor of ubuntu-22.04
          - { platform: linux-x86_64, runner: ubuntu-22.04 }
          - { platform: linux-aarch64, runner: ubuntu-22.04-arm }
          - { platform: macos-arm64, runner: macos-14 }
          - { platform: windows-x86_64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      # LF on Windows too, without a .gitattributes (the plugin directory refuses one that rewrites files at checkout):
      # the bash recipes, the .sh scripts and the regexes over the Markdown read LF.
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Pinned commit
        id: pin
        run: echo "commit=$(python -c 'import json; print(json.load(open("plugin/rdocx.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain named by rdocx's rust-toolchain.toml
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: .github/scripts/rust-toolchain.sh "$COMMIT"

      # release.yml's profile, so that both share the cache
      - name: ThinLTO and 16 codegen units
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=thin" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"

      - name: Restore the cargo registry and the build folder
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.local/share/rdocx-skills/target
          key: rdocx-build-thin-${{ matrix.platform }}-${{ matrix.runner }}-${{ steps.pin.outputs.commit }}
          restore-keys: rdocx-build-thin-${{ matrix.platform }}-${{ matrix.runner }}-

      - name: Build and install the pinned commit
        run: python plugin/scripts/rdocx_env.py install --build

      # also after a failed build: the next attempt starts from what compiled
      - name: Save the cargo registry and the build folder
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.local/share/rdocx-skills/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The files release.yml publishes when this run passes on the tree it releases: kept 90 days, and attested
      # here, the run that built them (not on a fork's pull request, whose token cannot attest)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: plugin/dist/${{ steps.pin.outputs.commit }}/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 90
          overwrite: true  # a re-run job uploads it again in the same run

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          subject-path: plugin/dist/${{ steps.pin.outputs.commit }}/${{ matrix.platform }}/*

      - name: Record this build in the run's copy of the lock
        run: python plugin/scripts/rdocx_env.py lock --write

      - name: Poppler, for the PDF text and raster checks
        run: .github/scripts/poppler.sh

      - name: Acceptance suite
        # one worker per core, each file on one worker in order (the recipes of a file build on each other)
        run: python plugin/scripts/rdocx_env.py test --allow-local -n auto --dist loadfile 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Suite summary
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
        run: .github/scripts/suite-summary.sh "$RUNNER_TEMP/pytest.log" "$PLATFORM" >> "$GITHUB_STEP_SUMMARY"

  tested:
    needs: [tree, test]
    if: needs.test.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Mark the tree
        env:
          TREE: ${{ needs.tree.outputs.tree }}
        run: echo "$TREE" > "$RUNNER_TEMP/tree.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-tree-${{ needs.tree.outputs.tree }}
          path: ${{ runner.temp }}/tree.txt
          retention-days: 90
          overwrite: true  # a re-run uploads it again in the same run
