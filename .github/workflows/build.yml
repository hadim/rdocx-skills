# Builds the rdocx and rpptx CLIs and wheels of one upstream commit on three native runners, runs the acceptance
# suite on each, and publishes them as the release rdocx-<UTC build date YYYYMMDD>-<first 12 characters of the
# commit> of this repository, which `rdocx_env.py lock --write --release` records in the lock and
# `rdocx_env.py install` downloads and checks against it. Runs on a bump (rdocx.lock.json changed on main), by hand
# on any upstream tag, branch or commit, and weekly on upstream main HEAD. A commit has at most one release: one
# whose tag ends with -<commit12> is never rebuilt nor overwritten. A failing suite does not block the release (a
# bump that closes gaps fails it on purpose): its summary goes into the release notes.
name: build

on:
  push:
    branches: [main]
    paths: [rdocx.lock.json]
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag, branch or full commit hash (empty: the commit pinned in rdocx.lock.json)"
        required: false
        default: ""
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      ref: ${{ steps.plan.outputs.ref }}
      repo: ${{ steps.plan.outputs.repo }}
      tag: ${{ steps.plan.outputs.tag }}
      date: ${{ steps.plan.outputs.date }}
      exists: ${{ steps.plan.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Commit to build
        id: plan
        env:
          REF: ${{ github.event_name == 'schedule' && 'main' || inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$REF" ]; then python scripts/rdocx_env.py bump "$REF"; fi
          commit=$(python -c 'import json; print(json.load(open("rdocx.lock.json"))["commit"])')
          ref=$(python -c 'import json; print(json.load(open("rdocx.lock.json")).get("ref", ""))')
          repo=$(python -c 'import json; print(json.load(open("rdocx.lock.json"))["upstream"].removeprefix("https://github.com/"))')
          c12=${commit:0:12}
          date=$(date -u +%Y-%m-%d)
          # The release the lock names (a bump empties it), else any release whose tag ends with -<commit12>, else
          # a new tag dated today (UTC): a commit is never built twice.
          locked=$(python -c 'import json; print(json.load(open("rdocx.lock.json")).get("release", "").rstrip("/").rsplit("/", 1)[-1])')
          tag=
          case "$locked" in
            *-"$c12") if gh release view "$locked" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then tag=$locked; fi ;;
          esac
          if [ -z "$tag" ]; then
            tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' | grep -e "-$c12\$" | head -n 1 || true)
          fi
          if [ -n "$tag" ]; then exists=true; else exists=false; tag="rdocx-${date//-/}-$c12"; fi
          { echo "commit=$commit"; echo "ref=$ref"; echo "repo=$repo"; echo "tag=$tag"; echo "date=$date"; echo "exists=$exists"; } >> "$GITHUB_OUTPUT"
          echo "$repo@$commit ($ref): release $tag, exists already: $exists" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-22.04 }
          - { platform: linux-aarch64, runner: ubuntu-22.04-arm }
          - { platform: macos-arm64, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Lock on the commit to build
        run: |
          python scripts/rdocx_env.py bump "$COMMIT"
          test "$(python -c 'import sys; sys.path.insert(0, "scripts"); import rdocx_env; print(rdocx_env.platform_key())')" = "$PLATFORM"

      - name: Rust toolchain named by rdocx's rust-toolchain.toml
        run: .github/scripts/rust-toolchain.sh "$COMMIT"

      - name: Restore the cargo registry and the build folder
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.local/share/rdocx-skills/target
          key: rdocx-build-${{ matrix.platform }}-${{ needs.plan.outputs.commit }}
          restore-keys: rdocx-build-${{ matrix.platform }}-

      # No release exists for this commit, so this builds it (the download attempt fails first).
      - name: Build and install
        run: python scripts/rdocx_env.py install --build

      - name: Save the cargo registry and the build folder
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.local/share/rdocx-skills/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: dist/${{ needs.plan.outputs.commit }}/${{ matrix.platform }}/
          if-no-files-found: error

      - name: Poppler, for the PDF text and raster checks
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q > /dev/null && sudo apt-get install -y -q --no-install-recommends poppler-utils > /dev/null
          else
            brew install --quiet poppler
          fi

      - name: Acceptance suite
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/rdocx_env.py test --allow-local 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Suite summary
        if: always()
        run: |
          .github/scripts/suite-summary.sh "$RUNNER_TEMP/pytest.log" "$PLATFORM" > "$RUNNER_TEMP/suite-$PLATFORM.md"
          cat "$RUNNER_TEMP/suite-$PLATFORM.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: suite-${{ matrix.platform }}
          path: ${{ runner.temp }}/suite-${{ matrix.platform }}.md

  release:
    needs: [plan, build]
    if: needs.plan.outputs.exists != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      REF: ${{ needs.plan.outputs.ref }}
      REPO: ${{ needs.plan.outputs.repo }}
      TAG: ${{ needs.plan.outputs.tag }}
      DATE: ${{ needs.plan.outputs.date }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Release assets
        run: |
          mkdir assets
          for dir in "$RUNNER_TEMP"/artifacts/dist-*; do
            plat=${dir##*/dist-}
            n=0
            for f in "$dir"/rdocx "$dir"/rpptx "$dir"/*.whl; do
              cp "$f" "assets/$plat.$(basename "$f")"
              n=$((n + 1))
            done
            [ "$n" -eq 4 ] || { echo "$plat: expected 2 CLIs and 2 wheels, found $n files"; exit 1; }
          done
          (cd assets && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS assets/
          cat assets/SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "$REPO@$COMMIT ($REF), built for linux-x86_64, linux-aarch64 and macos-arm64 by"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID from $GITHUB_REPOSITORY@$GITHUB_SHA."
            echo
            echo "These files are trusted only through rdocx.lock.json: \`rdocx_env.py bump $COMMIT\`, then"
            echo "\`rdocx_env.py lock --write --release\` after review. Provenance: \`gh attestation verify FILE -R $GITHUB_REPOSITORY\`."
            echo
            echo "## Acceptance suite"
            cat "$RUNNER_TEMP"/artifacts/suite-*/suite-*.md
          } > notes.md
          gh release create "$TAG" assets/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "rdocx $DATE ${COMMIT:0:12} ($REF)" --notes-file notes.md --latest=false

  # The pinned release is the one `install` downloads: on a bump pushed to main, mark it Latest, so the releases
  # page shows it first. The plan's tag is the one the lock names, or the one it will name once the release is
  # recorded. Candidate releases built by hand or by the weekly run stay unmarked.
  latest:
    needs: [plan, release]
    if: always() && github.event_name == 'push' && (needs.plan.outputs.exists == 'true' || needs.release.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Mark the pinned release Latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --latest
