# Builds the rdocx and rpptx CLIs and wheels of one upstream commit between two upstream releases on four native
# runners, runs the acceptance suite on each, and publishes them as the release rdocx-<UTC build date
# YYYYMMDD>-<first 12 characters of the commit> of this repository, which `rdocx_env.py lock --write --release`
# records in the lock when upstream has no release of that commit, and `rdocx_env.py install` downloads and checks
# against it. Runs by hand on any upstream tag, branch or commit, and weekly on upstream main HEAD (a candidate
# with the suite's results); a lock that pins upstream releases has nothing to build. A commit has at most one release: one
# whose tag ends with -<commit12> is never rebuilt nor overwritten, but a platform added to this workflow later is
# built and added to it (its files, its lines in SHA256SUMS, its suite summary in the notes). A failing suite does
# not block the release (a bump that closes gaps fails it on purpose): its summary goes into the release notes.
name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag, branch or full commit hash (empty: the commit pinned in rdocx.lock.json)"
        required: false
        default: ""
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      ref: ${{ steps.plan.outputs.ref }}
      repo: ${{ steps.plan.outputs.repo }}
      tag: ${{ steps.plan.outputs.tag }}
      date: ${{ steps.plan.outputs.date }}
      exists: ${{ steps.plan.outputs.exists }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Commit to build
        id: plan
        env:
          REF: ${{ github.event_name == 'schedule' && 'main' || inputs.ref }}
          GH_TOKEN: ${{ github.token }}
          # every platform of a release, with the native runner that builds it
          PLATFORMS: >-
            [{"platform": "linux-x86_64", "runner": "ubuntu-22.04"},
            {"platform": "linux-aarch64", "runner": "ubuntu-22.04-arm"},
            {"platform": "macos-arm64", "runner": "macos-14"},
            {"platform": "windows-x86_64", "runner": "windows-2025"}]
        run: |
          if [ -n "$REF" ]; then python scripts/rdocx_env.py bump "$REF"; fi
          if python -c 'import json, sys; sys.exit(not isinstance(json.load(open("rdocx.lock.json"))["release"], dict))'; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "The lock pins the upstream releases of this commit: nothing to build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          commit=$(python -c 'import json; print(json.load(open("rdocx.lock.json"))["commit"])')
          ref=$(python -c 'import json; print(json.load(open("rdocx.lock.json")).get("ref", ""))')
          repo=$(python -c 'import json; print(json.load(open("rdocx.lock.json"))["upstream"].removeprefix("https://github.com/"))')
          c12=${commit:0:12}
          date=$(date -u +%Y-%m-%d)
          # The release the lock names (a bump empties it), else any release whose tag ends with -<commit12>, else
          # a new tag dated today (UTC): a commit is never built twice.
          locked=$(python -c 'import json; print(json.load(open("rdocx.lock.json")).get("release", "").rstrip("/").rsplit("/", 1)[-1])')
          tag=
          case "$locked" in
            *-"$c12") if gh release view "$locked" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then tag=$locked; fi ;;
          esac
          if [ -z "$tag" ]; then
            tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' | grep -e "-$c12\$" | head -n 1 || true)
          fi
          if [ -n "$tag" ]; then exists=true; else exists=false; tag="rdocx-${date//-/}-$c12"; fi
          # What to build: every platform for a new release; for an existing one, only the platforms its SHA256SUMS
          # does not list (lines `<sha256>  <platform>.<file>`), so that its files are never rebuilt.
          have=
          if [ "$exists" = true ]; then
            have=$(gh release download "$tag" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -O - | awk '{ sub(/\..*/, "", $2); print $2 }')
          fi
          matrix=$(HAVE="$have" python -c 'import json, os; have = os.environ["HAVE"].split(); print(json.dumps([p for p in json.loads(os.environ["PLATFORMS"]) if p["platform"] not in have]))')
          { echo "commit=$commit"; echo "ref=$ref"; echo "repo=$repo"; echo "tag=$tag"; echo "date=$date"; echo "exists=$exists"; echo "matrix=$matrix"; } >> "$GITHUB_OUTPUT"
          echo "$repo@$commit ($ref): release $tag, exists already: $exists, to build: $matrix" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Lock on the commit to build
        run: |
          python scripts/rdocx_env.py bump "$COMMIT"
          test "$(python -c 'import sys; sys.path.insert(0, "scripts"); import rdocx_env; print(rdocx_env.platform_key())')" = "$PLATFORM"

      - name: Rust toolchain named by rdocx's rust-toolchain.toml
        run: .github/scripts/rust-toolchain.sh "$COMMIT"

      - name: Restore the cargo registry and the build folder
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.local/share/rdocx-skills/target
          key: rdocx-build-${{ matrix.platform }}-${{ needs.plan.outputs.commit }}
          restore-keys: rdocx-build-${{ matrix.platform }}-

      # No release exists for this commit, so this builds it (the download attempt fails first).
      - name: Build and install
        run: python scripts/rdocx_env.py install --build

      # also after a failed build: the next attempt starts from what compiled
      - name: Save the cargo registry and the build folder
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.local/share/rdocx-skills/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: dist/${{ needs.plan.outputs.commit }}/${{ matrix.platform }}/
          if-no-files-found: error

      - name: Poppler, for the PDF text and raster checks
        run: .github/scripts/poppler.sh

      - name: Acceptance suite
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/rdocx_env.py test --allow-local 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Suite summary
        if: always()
        run: |
          .github/scripts/suite-summary.sh "$RUNNER_TEMP/pytest.log" "$PLATFORM" > "$RUNNER_TEMP/suite-$PLATFORM.md"
          cat "$RUNNER_TEMP/suite-$PLATFORM.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: suite-${{ matrix.platform }}
          path: ${{ runner.temp }}/suite-${{ matrix.platform }}.md

  # A new release, or the files of the platforms an existing one lacked, added to it.
  release:
    needs: [plan, build]
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      REF: ${{ needs.plan.outputs.ref }}
      REPO: ${{ needs.plan.outputs.repo }}
      TAG: ${{ needs.plan.outputs.tag }}
      DATE: ${{ needs.plan.outputs.date }}
      EXISTS: ${{ needs.plan.outputs.exists }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Release assets
        run: |
          mkdir assets
          for dir in "$RUNNER_TEMP"/artifacts/dist-*; do
            plat=${dir##*/dist-}
            n=0
            for f in "$dir"/rdocx "$dir"/rpptx "$dir"/rdocx.exe "$dir"/rpptx.exe "$dir"/*.whl; do
              [ -e "$f" ] || continue  # the CLIs are rdocx.exe and rpptx.exe on Windows only
              cp "$f" "assets/$plat.$(basename "$f")"
              n=$((n + 1))
            done
            [ "$n" -eq 4 ] || { echo "$plat: expected 2 CLIs and 2 wheels, found $n files"; exit 1; }
          done
          (cd assets && sha256sum -- *) > SHA256SUMS
          if [ "$EXISTS" = true ]; then  # the release's own lines, kept, then the new ones
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -O old-sums
            if awk '{ print $2 }' old-sums SHA256SUMS | sort | uniq -d | grep .; then
              echo "these files are in the release already: they are never replaced"; exit 1
            fi
            cat old-sums SHA256SUMS | sort -k 2 > sums && mv sums SHA256SUMS
          fi
          mv SHA256SUMS assets/
          cat assets/SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      - name: Publish
        run: |
          plats=$(for d in "$RUNNER_TEMP"/artifacts/dist-*; do echo "${d##*/dist-}"; done | paste -sd, - | sed 's/,/, /g')
          built="$REPO@$COMMIT ($REF), built for $plats by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID from $GITHUB_REPOSITORY@$GITHUB_SHA."
          if [ "$EXISTS" = true ]; then
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
            {
              echo
              echo "## Added later: $plats"
              echo
              echo "$built"
              echo
              cat "$RUNNER_TEMP"/artifacts/suite-*/suite-*.md
            } >> notes.md
            new=()
            for f in assets/*; do [ "${f##*/}" = SHA256SUMS ] || new+=("$f"); done
            gh release upload "$TAG" "${new[@]}" -R "$GITHUB_REPOSITORY"  # without --clobber: never replaces a file
            gh release upload "$TAG" assets/SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md
            exit 0
          fi
          {
            echo "$built"
            echo
            echo "These files are trusted only through rdocx.lock.json: \`rdocx_env.py bump $COMMIT\`, then"
            echo "\`rdocx_env.py lock --write --release\` after review. Provenance: \`gh attestation verify FILE -R $GITHUB_REPOSITORY\`."
            echo
            echo "## Acceptance suite"
            cat "$RUNNER_TEMP"/artifacts/suite-*/suite-*.md
          } > notes.md
          gh release create "$TAG" assets/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "rdocx $DATE ${COMMIT:0:12} ($REF)" --notes-file notes.md --latest=false
